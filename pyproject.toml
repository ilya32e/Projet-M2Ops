[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "la-gazette"
version = "0.1.0"
description = "Collecte RSS/Atom minimale pour La Gazette"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.14,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
