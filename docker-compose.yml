services:
  app:
    profiles: [local]
    build: .
    environment:
      GAZETTE_TIMEOUT_SECONDS: "15"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./articles_bruts:/app/articles_bruts

  airflow-init:
    profiles: [airflow]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow-dev-only@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./sources.csv:/opt/gazette/sources.csv:ro
      - ./migrations:/opt/gazette/migrations:ro
      - ./src:/opt/gazette/src:ro
      - ./data:/opt/gazette/data
      - ./articles_bruts:/opt/gazette/articles_bruts
    command: >-
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin
      --lastname Gazette --role Admin --email admin@example.invalid || true"

  airflow-webserver:
    profiles: [airflow]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    profiles: [airflow]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: scheduler

  airflow-postgres:
    profiles: [airflow]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gazette
      POSTGRES_USER: gazette
      POSTGRES_PASSWORD: gazette-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazette -d gazette"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  airflow-postgres-data:
